# "Task" = la tâche d'apprentissage : modèle + optimiseur + perte, assemblés
# dans xp.train.module.binary_classification.BinaryDecisionModule.
defaults:
  - optimizer: sgd
  - loss: bce
  - model: perceptron

_target_: xp.train.module.binary_classification.BinaryDecisionModule
threshold: 0.5
optim_metric: ${optimization_metric}
