# Expérience MLP, lancée par : poetry run ia-xp-conf train_mlp
#
# Même données que le perceptron. Le modèle vient de model/mlp.yaml.
# Les courbes TensorBoard sont rangées à part, sous le nom mlp.

defaults:
  - data: perceptron
  - model: mlp
  - trainer: default
  - module: classification
  - task: multiclass # multiclass #binary
  - callbacks: default
  - logger: tensorboard
  - augmentation: standardize #none
  - _self_

mode: train
seed: 42
output_dir: logs/train_mlp
checkpoint: null
predictions: predictions.csv

logger:
  params:
    name: mlp


model:
  input_features: 4
  hidden_features: 8
  hidden_layers: 1
  output_features: 3