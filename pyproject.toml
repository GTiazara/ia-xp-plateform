[tool.poetry]
name = "ia-xp-plateform"
version = "0.1.0"
description = "Plateforme d'expériences (XP) pour apprendre l'IA pas à pas, en s'inspirant de l'architecture de bdf-model."
authors = []
readme = "README.md"
packages = [{ include = "xp" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = "^2.6.0"
pytorch-lightning = "^2.5.0"
torchmetrics = "^1.7.0"
hydra-core = "^1.3.2"
hydra-colorlog = "^1.2.0"
omegaconf = "^2.3.0"
python-dotenv = "^1.0.1"
tensorboard = "^2.15.1"
numpy = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.6.0"
black = "^24.0.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
multi_line_output = 7
force_single_line = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
unfixable = ["F401"]

[tool.ruff.lint.isort]
force-single-line = true
