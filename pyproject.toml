[project]
name = "ia-xp-plateform"
version = "0.1.0"
description = "module ia perso"
authors = [
    {name = "tiazara gaetan"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch (>=2.15.0,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "pytorch-lightning (>=2.6.6,<3.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)",
    "tables (>=3.11.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"

